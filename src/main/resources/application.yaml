# Cấu hình chung; profile home bổ sung kết nối DB trong file bên cạnh.
spring:
  application:
    name: telecom-management
  config:
    import: "optional:file:./.env[.properties]"
  jpa:
    properties:
      hibernate:
        type:
          preferred_uuid_jdbc_type: CHAR

server:
  port: 8080

# Mới dùng health để kiểm nền tảng; chưa có endpoint nghiệp vụ cộng/trừ tiền.
management:
  endpoints:
    web:
      exposure:
        include: health

# Cấu hình cho app
telecom:
  money:
    max-balance: 100000000
    max-credit-amount: 10000000
