<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:678px;height:418px;background:#FFFFFF;" width="678px" height="418px" viewBox="0 0 678 418" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="174.488" y="24.533" fill="#000" font-size="14" textLength="322.841" font-weight="700">Account - expiry and monetary effects (REVIEW)</text></g><g class="start_entity" data-qualified-name=".start." id="ent0001" data-source-line="2"><ellipse cx="47.5" cy="54.609" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="ACTIVE" id="ent0002" data-source-line="2"><rect x="12" y="179.609" width="70.565" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="12" y1="207.219" x2="82.565" y2="207.219" style="stroke:#181818;stroke-width:0.5;"/><text x="22" y="199.143" fill="#000" font-size="14" textLength="50.565">ACTIVE</text></g><g class="entity" data-qualified-name="EXPIRED" id="ent0005" data-source-line="4"><rect x="7" y="349.109" width="81.462" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="7" y1="376.719" x2="88.462" y2="376.719" style="stroke:#181818;stroke-width:0.5;"/><text x="17" y="368.643" fill="#000" font-size="14" textLength="61.462">EXPIRED</text></g><g class="entity" data-qualified-name="GMN7" id="ent0008" data-source-line="6"><path d="M309,158.609 L309,200.609 L83.08,204.609 L309,208.609 L309,250.367 A0,0 0 0 0 309,250.367 L663.817,250.367 A0,0 0 0 0 663.817,250.367 L663.817,168.609 L653.817,158.609 L309,158.609 A0,0 0 0 0 309,158.609" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M653.817,158.609 L653.817,168.609 L663.817,168.609 L653.817,158.609" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="315" y="177.104" fill="#000" font-size="13" textLength="159.688">MAIN has no default expiry.</text><text x="315" y="193.456" fill="#000" font-size="13" textLength="333.817">Subsidiary type / permissions / expiry explicit before seed.</text><text x="315" y="209.808" fill="#000" font-size="13" textLength="323">Check DB clock under account row lock before updates.</text><text x="315" y="226.159" fill="#000" font-size="13" textLength="324.397">checkedAt >= expiresAt rejects; commit may occur later.</text><text x="315" y="242.511" fill="#000" font-size="13" textLength="237.053">No fallback/pooling; no negative balance.</text></g><g class="entity" data-qualified-name="GMN10" id="ent0011" data-source-line="13"><path d="M123,344.609 L123,370.109 L88.01,374.109 L123,378.109 L123,403.664 A0,0 0 0 0 123,403.664 L459.777,403.664 A0,0 0 0 0 459.777,403.664 L459.777,354.609 L449.777,344.609 L123,344.609 A0,0 0 0 0 123,344.609" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M449.777,344.609 L449.777,354.609 L459.777,354.609 L449.777,344.609" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="129" y="363.104" fill="#000" font-size="13" textLength="150.325">Keep balance and history.</text><text x="129" y="379.456" fill="#000" font-size="13" textLength="313.581">Timestamp rejects new effects even before state sync.</text><text x="129" y="395.808" fill="#000" font-size="13" textLength="315.777">No automatic credit/reactivation/refund policy invented.</text></g><!--link *start* to ACTIVE--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk3" data-source-line="2" data-link-type="dependency"><path d="M47.5,64.869 C47.5,87.459 47.5,140.999 47.5,174.369" style="stroke:#181818;stroke-width:1;" fill="none" id="*start*-to-ACTIVE"/><polygon points="47.5,179.369,51.5,170.369,47.5,174.369,43.5,170.369,47.5,179.369" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="66.578" y="109.104" fill="#000" font-size="13" textLength="133.663">MAIN created by UC01</text><text x="48.5" y="125.456" fill="#000" font-size="13" textLength="169.819">or configured subsidiary seed</text></g><!--link ACTIVE to ACTIVE--><g class="link" data-entity-1="ent0002" data-entity-2="ent0002" id="lnk4" data-source-line="3" data-link-type="dependency"><path d="M83.05,187.969 C101.43,185.409 118,190.949 118,204.609 C118,218.269 106.382,224.499 88.002,221.939" style="stroke:#181818;stroke-width:1;" fill="none" id="ACTIVE-to-ACTIVE"/><polygon points="83.05,221.249,91.412,226.453,88.002,221.939,92.516,218.529,83.05,221.249" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="126.174" y="202.104" fill="#000" font-size="13" textLength="157.511">valid credit/debit committed</text><text x="124" y="218.456" fill="#000" font-size="13" textLength="161.859">preserve ledger consistency</text></g><!--link ACTIVE to EXPIRED--><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" id="lnk6" data-source-line="4" data-link-type="dependency"><path d="M47.5,229.969 C47.5,261.809 47.5,312.269 47.5,343.999" style="stroke:#181818;stroke-width:1;" fill="none" id="ACTIVE-to-EXPIRED"/><polygon points="47.5,348.999,51.5,339.999,47.5,343.999,43.5,339.999,47.5,348.999" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="51.753" y="295.104" fill="#000" font-size="13" textLength="148.84">expiry timestamp reached</text><text x="48.5" y="311.456" fill="#000" font-size="13" textLength="155.346">JOB-01 synchronizes state</text></g></g></svg>