<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:2537px;height:585px;background:#FFFFFF;" width="2537px" height="585px" viewBox="0 0 2537 585" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="1102.18" y="24.533" fill="#000" font-size="14" textLength="325.985" font-weight="700">DRAFT - PackageSubscription business lifecycle</text></g><g class="entity" data-qualified-name="Active" id="ent0001" data-source-line="2"><rect x="662.5" y="147.109" width="73.689" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="662.5" y1="174.719" x2="736.189" y2="174.719" style="stroke:#181818;stroke-width:0.5;"/><text x="672.5" y="166.643" fill="#000" font-size="14" textLength="53.689">Effective</text></g><g class="entity" data-qualified-name="CancelPending" id="ent0002" data-source-line="3"><rect x="7" y="284.109" width="150.765" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="7" y1="311.719" x2="157.765" y2="311.719" style="stroke:#181818;stroke-width:0.5;"/><text x="17" y="303.643" fill="#000" font-size="14" textLength="130.765">Cancellation pending</text></g><g class="entity" data-qualified-name="Expired" id="ent0003" data-source-line="4"><rect x="636" y="416.609" width="126.606" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="636" y1="444.219" x2="762.606" y2="444.219" style="stroke:#181818;stroke-width:0.5;"/><text x="646" y="436.143" fill="#000" font-size="14" textLength="106.606">Expired / inactive</text></g><g class="start_entity" data-qualified-name=".start." id="ent0004" data-source-line="5"><ellipse cx="699.5" cy="54.609" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name=".end." id="ent0011" data-source-line="11"><ellipse cx="595.5" cy="549.109" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="595.5" cy="549.109" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN13" id="ent0014" data-source-line="13"><path d="M193,279.609 L193,305.109 L158.08,309.109 L193,313.109 L193,338.664 A0,0 0 0 0 193,338.664 L1245.881,338.664 A0,0 0 0 0 1245.881,338.664 L1245.881,289.609 L1235.881,279.609 L193,279.609 A0,0 0 0 0 193,279.609" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1235.881,279.609 L1235.881,289.609 L1245.881,289.609 L1235.881,279.609" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="199" y="298.104" fill="#000" font-size="13" textLength="233.391">Remains usable until current cycle ends.</text><text x="199" y="314.456" fill="#000" font-size="13" textLength="293.382">New repeated cancellation request: business error.</text><text x="199" y="330.808" fill="#000" font-size="13" textLength="1031.881">Same-request retry: replay; new repeated request: error.\n  Cancellation accepted before cycle end blocks renewal.\n  Exact acceptance/commit boundary remains detailed design.</text></g><g class="entity" data-qualified-name="GMN16" id="ent0017" data-source-line="18"><path d="M1601,142.609 L1601,168.109 L736.74,172.109 L1601,176.109 L1601,201.664 A0,0 0 0 0 1601,201.664 L2522.345,201.664 A0,0 0 0 0 2522.345,201.664 L2522.345,152.609 L2512.345,142.609 L1601,142.609 A0,0 0 0 0 1601,142.609" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M2512.345,142.609 L2512.345,152.609 L2522.345,152.609 L2512.345,142.609" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="1607" y="161.104" fill="#000" font-size="13" textLength="238.45">Analytical labels, not final API/DB enums.</text><text x="1607" y="177.456" fill="#000" font-size="13" textLength="900.345">Cycle length in days; insufficient funds => no grace.\n  Applied price snapshot per registration/renewal.\n  Day arithmetic and technical-error retry: OQ-07/09.</text><text x="1607" y="193.808" fill="#000" font-size="13" textLength="259.403">Failed initial collection never enters Effective.</text></g><g class="entity" data-qualified-name="GMN19" id="ent0020" data-source-line="23"><path d="M642,527.609 L642,570.313 A0,0 0 0 0 642,570.313 L967.224,570.313 A0,0 0 0 0 967.224,570.313 L967.224,537.609 L957.224,527.609 L788.06,527.609 L723.59,466.809 L780.06,527.609 L642,527.609 A0,0 0 0 0 642,527.609" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M957.224,527.609 L957.224,537.609 L967.224,537.609 L957.224,527.609" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="648" y="546.104" fill="#000" font-size="13" textLength="304.224">Preserve subscription history and package definition.</text><text x="648" y="562.456" fill="#000" font-size="13" textLength="282.515">Grace/recovery/re-registration rules not invented.</text></g><!--link *start* to Active--><g class="link" data-entity-1="ent0004" data-entity-2="ent0001" id="lnk5" data-source-line="5" data-link-type="dependency"><path d="M699.5,64.669 C699.5,82.219 699.5,116.369 699.5,141.979" style="stroke:#181818;stroke-width:1;" fill="none" id="*start*-to-Active"/><polygon points="699.5,146.979,703.5,137.979,699.5,141.979,695.5,137.979,699.5,146.979" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="700.5" y="109.104" fill="#000" font-size="13" textLength="241.351">registration AND fee collection succeeded</text></g><!--link Active to CancelPending--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk6" data-source-line="6" data-link-type="dependency"><path d="M662.37,179.379 C576.24,194.199 356.34,233.639 175.5,279.609 C169.85,281.049 168.853,281.255 163.023,282.895" style="stroke:#181818;stroke-width:1;" fill="none" id="Active-to-CancelPending"/><polygon points="158.21,284.249,167.957,285.663,163.023,282.895,165.791,277.962,158.21,284.249" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="377.5" y="246.104" fill="#000" font-size="13" textLength="125.03">cancellation accepted</text></g><!--link CancelPending to Expired--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk7" data-source-line="7" data-link-type="dependency"><path d="M158.19,334.029 C164.03,335.649 169.85,337.199 175.5,338.609 C339.82,379.659 531.637,413.266 630.777,429.606" style="stroke:#181818;stroke-width:1;" fill="none" id="CancelPending-to-Expired"/><polygon points="635.71,430.419,627.48,425.009,630.777,429.606,626.179,432.903,635.71,430.419" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="391.5" y="383.104" fill="#000" font-size="13" textLength="105.492">current cycle ends</text></g><!--link Active to Active--><g class="link" data-entity-1="ent0001" data-entity-2="ent0001" id="lnk8" data-source-line="8" data-link-type="dependency"><path d="M736.55,165.919 C755.02,165.069 771.5,167.129 771.5,172.109 C771.5,177.089 760.015,179.379 741.545,178.529" style="stroke:#181818;stroke-width:1;" fill="none" id="Active-to-Active"/><polygon points="736.55,178.299,745.357,182.709,741.545,178.529,745.724,174.717,736.55,178.299" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="777.5" y="177.604" fill="#000" font-size="13" textLength="344.697">automatic renewal [eligible, sufficient funds, no cancellation]</text></g><!--link Active to Active--><g class="link" data-entity-1="ent0001" data-entity-2="ent0001" id="lnk9" data-source-line="9" data-link-type="dependency"><path d="M736.51,165.659 C843,155.479 1127.5,157.629 1127.5,172.109 C1127.5,186.589 847.977,189.215 741.487,179.035" style="stroke:#181818;stroke-width:1;" fill="none" id="Active-to-Ac