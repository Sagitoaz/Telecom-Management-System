6.449,601,125.449" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link NotPurchased to ACTIVE--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk5" data-source-line="3" data-link-type="dependency"><path d="M601,175.729 C601,200.999 601,235.459 601,260.799" style="stroke:#181818;stroke-width:1;" fill="none" id="NotPurchased-to-ACTIVE"/><polygon points="601,265.799,605,256.799,601,260.799,597,256.799,601,265.799" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="602" y="220.104" fill="#000" font-size="13" textLength="150.63">first fee + cycle committed</text></g><!--link ACTIVE to ACTIVE--><g class="link" data-entity-1="ent0004" data-entity-2="ent0004" id="lnk6" data-source-line="4" data-link-type="dependency"><path d="M636.55,284.239 C654.93,283.179 671.5,285.469 671.5,291.109 C671.5,296.749 659.922,299.327 641.542,298.267" style="stroke:#181818;stroke-width:1;" fill="none" id="ACTIVE-to-ACTIVE"/><polygon points="636.55,297.979,645.305,302.491,641.542,298.267,645.765,294.504,636.55,297.979" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="677.5" y="288.604" fill="#000" font-size="13" textLength="204.483">explicit extension / version matches</text><text x="694.816" y="304.956" fill="#000" font-size="13" textLength="169.851">one fee, extend coverageEnd</text></g><!--link ACTIVE to ACTIVE--><g class="link" data-entity-1="ent0004" data-entity-2="ent0004" id="lnk14" data-source-line="9" data-link-type="dependency"><path d="M636.76,282.889 C716.36,272.689 887.5,275.429 887.5,291.109 C887.5,306.789 721.319,310.165 641.719,299.965" style="stroke:#181818;stroke-width:1;" fill="none" id="ACTIVE-to-ACTIVE-1"/><polygon points="636.76,299.329,645.179,304.441,641.719,299.965,646.195,296.506,636.76,299.329" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="893.5" y="288.604" fill="#000" font-size="13" textLength="164.747">one valid renewal committed</text><text x="907.947" y="304.956" fill="#000" font-size="13" textLength="135.853">no retroactive coverage</text></g><!--link ACTIVE to PENDING_CANCEL--><g class="link" data-entity-1="ent0004" data-entity-2="ent0007" id="lnk8" data-source-line="5" data-link-type="dependency"><path d="M565.45,298.249 C511.67,308.049 406.77,329.169 321,358.609 C251.26,382.549 178.762,417.404 131.262,441.674" style="stroke:#181818;stroke-width:1;" fill="none" id="ACTIVE-to-PENDING_CANCEL"/><polygon points="126.81,443.949,136.644,443.416,131.262,441.674,133.004,436.292,126.81,443.949" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="347.825" y="381.604" fill="#000" font-size="13" textLength="172.009">durable cancellation accepted</text><text x="322" y="397.956" fill="#000" font-size="13" textLength="223.66">freeze cancelEffectiveAt=coverageEnd</text></g><!--link PENDING_CANCEL to CANCELLED--><g class="link" data-entity-1="ent0007" data-entity-2="ent0009" id="lnk10" data-source-line="6" data-link-type="dependency"><path d="M141.63,494.199 C215.5,523.549 334.383,570.793 404.183,598.533" style="stroke:#181818;stroke-width:1;" fill="none" id="PENDING_CANCEL-to-CANCELLED"/><polygon points="408.83,600.379,401.944,593.338,404.183,598.533,398.989,600.773,408.83,600.379" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="332.651" y="543.104" fill="#000" font-size="13" textLength="145.971">now >= cancelEffectiveAt</text><text x="307" y="559.456" fill="#000" font-size="13" textLength="197.272">no refund, preserve all paid cycles</text></g><!--link ACTIVE to EXPIRED--><g class="link" data-entity-1="ent0004" data-entity-2="ent0011" id="lnk12" data-source-line="7" data-link-type="dependency"><path d="M599.05,316.149 C598.31,342.939 601.65,385.639 627,409.609 C687.21,466.