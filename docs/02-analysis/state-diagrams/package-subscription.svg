g class="entity" data-qualified-name="CANCELLED" id="ent0009" data-source-line="6"><rect x="409" y="597.109" width="104.027" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="409" y1="624.719" x2="513.027" y2="624.719" style="stroke:#181818;stroke-width:0.5;"/><text x="419" y="616.643" fill="#000" font-size="14" textLength="84.027">CANCELLED</text></g><g class="entity" data-qualified-name="EXPIRED" id="ent0011" data-source-line="7"><rect x="852.5" y="444.109" width="81.462" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="852.5" y1="471.719" x2="933.962" y2="471.719" style="stroke:#181818;stroke-width:0.5;"/><text x="862.5" y="463.643" fill="#000" font-size="14" textLength="61.462">EXPIRED</text></g><g class="entity" data-qualified-name="GMN16" id="ent0017" data-source-line="12"><path d="M1099.5,253.609 L1099.5,287.109 L636.71,291.109 L1099.5,295.109 L1099.5,329.016 A0,0 0 0 0 1099.5,329.016 L1482.913,329.016 A0,0 0 0 0 1482.913,329.016 L1482.913,263.609 L1472.913,253.609 L1099.5,253.609 A0,0 0 0 0 1099.5,253.609" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1472.913,253.609 L1472.913,263.609 L1482.913,263.609 L1472.913,253.609" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="1105.5" y="272.104" fill="#000" font-size="13" textLength="191.515">State alone does not grant rights.</text><text x="1105.5" y="288.456" fill="#000" font-size="13" textLength="316.45">A committed cycle must cover checkedAt in [start,end).</text><text x="1105.5" y="304.808" fill="#000" font-size="13" textLength="324.479">API denies at expiry even before daily job updates state.</text><text x="1105.5" y="321.159" fill="#000" font-size="13" textLength="362.413">expectedVersion + shared cycle guard prevents duplicate fees.</text></g><g class="entity" data-qualified-name="GMN19" id="ent0020" data-source-line="18"><path d="M190.5,439.609 L190.5,465.109 L155.01,46