<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1573px;height:403px;background:#FFFFFF;" width="1573px" height="403px" viewBox="0 0 1573 403" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="587.016" y="24.533" fill="#000" font-size="14" textLength="392.807" font-weight="700">CancellationIntent - CR-CAN-003 (REVIEW implementation)</text></g><g class="start_entity" data-qualified-name=".start." id="ent0001" data-source-line="2"><ellipse cx="687" cy="54.609" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="PENDING" id="ent0002" data-source-line="2"><rect x="645" y="163.609" width="83.786" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="645" y1="191.219" x2="728.786" y2="191.219" style="stroke:#181818;stroke-width:0.5;"/><text x="655" y="183.143" fill="#000" font-size="14" textLength="63.786">PENDING</text></g><g class="entity" data-qualified-name="ACCEPTED" id="ent0004" data-source-line="3"><rect x="7" y="325.109" width="96.234" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="7" y1="352.719" x2="103.234" y2="352.719" style="stroke:#181818;stroke-width:0.5;"/><text x="17" y="344.643" fill="#000" font-size="14" textLength="76.234">ACCEPTED</text></g><g class="entity" data-qualified-name="REJECTED" id="ent0006" data-source-line="4"><rect x="876" y="325.109" width="93.896" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="876" y1="352.719" x2="969.896" y2="352.719" style="stroke:#181818;stroke-width:0.5;"/><text x="886" y="344.643" fill="#000" font-size="14" textLength="73.896">REJECTED</text></g><g class="entity" data-qualified-name="GMN11" id="ent0012" data-source-line="9"><path d="M764,142.609 L764,184.609 L729.05,188.609 L764,192.609 L764,234.367 A0,0 0 0 0 764,234.367 L1208.109,234.367 A0,0 0 0 0 1208.109,234.367 L1208.109,152.609 L1198.109,142.609 L764,142.609 A0,0 0 0 0 764,142.609" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1198.109,142.609 L1198.109,152.609 L1208.109,152.609 L1198.109,142.609" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="770" y="161.104" fill="#000" font-size="13" textLength="292.646">Temporarily blocks renewal and manual extension.</text><text x="770" y="177.456" fill="#000" font-size="13" textLength="356.237">TxB coordinates slot/request and takes DB receiptCheckedAt.</text><text x="770" y="193.808" fill="#000" font-size="13" textLength="423.109">Accept only same observedVersion and receipt &lt; observedCoverageEnd.</text><text x="770" y="210.159" fill="#000" font-size="13" textLength="335.264">Commit unknown => lookup/recovery; never infer rollback.</text><text x="770" y="226.511" fill="#000" font-size="13" textLength="358.42">Recovery obtains receipt now; no fabricated early acceptance.</text></g><g class="entity" data-qualified-name="GMN14" id="ent0015" data-source-line="16"><path d="M407,312.609 L407,346.109 L103.06,350.109 L407,354.109 L407,388.016 A0,0 0 0 0 407,388.016 L841.309,388.016 A0,0 0 0 0 841.309,388.016 L841.309,322.609 L831.309,312.609 L407,312.609 A0,0 0 0 0 407,312.609" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M831.309,312.609 L831.309,322.609 L841.309,322.609 L831.309,312.609" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="413" y="331.104" fill="#000" font-size="13" textLength="341.764">Intent and operation SUCCEEDED commit together in TxB.</text><text x="413" y="347.456" fill="#000" font-size="13" textLength="371.357">TxB commit may cross deadline; earlier valid receipt still applies.</text><text x="413" y="363.808" fill="#000" font-size="13" textLength="394.539">Root PENDING_CANCEL, effective at end of ALL prepaid coverage.</text><text x="413" y="380.159" fill="#000" font-size="13" textLength="413.309">HTTP response loss never converts stored accepted outcome to failure.</text></g><g class="entity" data-qualified-name="GMN17" id="ent0018" data-source-line="22"><path d="M1251,320.609 L1251,346.109 L970.07,350.109 L1251,354.109 L1251,379.664 A0,0 0 0 0 1251,379.664 L1558.838,379.664 A0,0 0 0 0 1558.838,379.664 L1558.838,330.609 L1548.838,320.609 L1251,320.609 A0,0 0 0 0 1251,320.609" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1548.838,320.609 L1548.838,330.609 L1558.838,330.609 L1548.838,320.609" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="1257" y="339.104" fill="#000" font-size="13" textLength="286.838">TOO_LATE or version conflict; operation FAILED.</text><text x="1257" y="355.456" fill="#000" font-size="13" textLength="237.751">Release pending guard, preserve history.</text><text x="1257" y="371.808" fill="#000" font-size="13" textLength="245.667">No automatic new-cycle retarget or refund.</text></g><!--link *start* to PENDING--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk3" data-source-line="2" data-link-type="dependency"><path d="M687,64.679 C687,84.839 687,128.889 687,158.579" style="stroke:#181818;stroke-width:1;" fill="none" id="*start*-to-PENDING"/><polygon points="687,163.579,691,154.579,687,158.579,683,154.579,687,163.579" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="688" y="109.104" fill="#000" font-size="13" textLength="190.747">TxA validates and commits intent</text></g><!--link PENDING to ACCEPTED--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk5" data-source-line="3" data-link-type="dependency"><path d="M644.55,200.319 C531.36,228.889 227.648,305.536 108.078,335.716" style="stroke:#181818;stroke-width:1;" fill="none" id="PENDING-to-ACCEPTED"/><polygon points="103.23,336.939,112.935,338.615,108.078,335.716,110.977,330.858,103.23,336.939" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="372" y="279.104" fill="#000" font-size="13" textLength="185.65">TxB after confirmed TxA commit</text></g><!--link PENDING to REJECTED--><g class="link" data-entity-1="ent0002" data-entity-2="ent0006" id="lnk7" data-source-line="4" data-link-type="dependency"><path d="M678.08,213.889 C672.2,234.569 668.17,263.839 684,282.609 C734.87,342.939 784.71,285.989 859,312.609 C868.03,315.849 872.882,317.905 881.422,322.615" style="stroke:#181818;stroke-width:1;" fill="none" id="PENDING-to-REJECTED"/><polygon points="885.8,325.029,879.851,317.18,881.422,322.615,875.987,324.186,885.8,325.029" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="685" y="279.104" fill="#000" font-size="13" textLength="194.403">receipt >= observedCoverageEnd</text></g><!--link PENDING to REJECTED--><g class="link" data-entity-1="ent0002" data-entity-2="ent0006" id="lnk8" data-source-line="5" data-link-type="dependency"><path d="M714.1,213.799 C723.89,221.459 735.4,229.299 747,234.609 C803.67,260.569 835.41,225.559 884,264.609 C902.77,279.689 911.597,301.012 916.787,320.242" style="stroke:#181818;stroke-width:1;" fill="none" id="PENDING-to-REJECTED-1"/><polygon points="918.09,325.069,919.607,315.338,916.787,320.242,911.883,317.423,918.09,325.069" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="900" y="279.104" fill="#000" font-size="13" textLength="111.992">root version conflict</text></g><!--link ACCEPTED to ACCEPTED--><g class="link" data-entity-1="ent0004" data-entity-2="ent0004" id="lnk9" data-source-line="6" data-link-type="dependency"><path d="M103.18,335.929 C122.15,335.219 138,339.939 138,350.109 C138,360.279 127.147,365.186 108.177,364.476" style="stroke:#181818;stroke-width:1;" fill="none" id="ACCEPTED-to-ACCEPTED"/><polygon points="103.18,364.289,112.024,368.623,108.177,364.476,112.323,360.629,103.18,364.289" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="144" y="355.604" fill="#000" font-size="13" textLength="239.18">same requestId replay after lost response</text></g><!--link REJECTED to REJECTED--><g class="link" data-entity-1="ent0006" data-entity-2="ent0006" id="lnk10" data-source-line="7" data-link-type="dependency"><path d="M970.19,335.949 C989.11,335.149 1005,339.869 1005,350.109 C1005,360.349 994.106,365.281 975.186,364.481" style="stroke:#181818;stroke-width:1;" fill="none" id="REJECTED-to-REJECTED"/><polygon points="970.19,364.269,979.013,368.646,975.186,364.481,979.351,360.653,970.19,364.269" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1011" y="355.604" fill="#000" font-size="13" textLength="216.068">same requestId replay, no retargeting</text></g></g></svg>